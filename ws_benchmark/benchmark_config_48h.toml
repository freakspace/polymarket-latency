# 48-hour Polymarket WS latency study.
#
# Run with:
#   .venv/bin/python ws_benchmark/benchmark.py --config ws_benchmark/benchmark_config_48h.toml
#
# Series 10684 = btc-updown-5m (rolling 5-minute markets); the benchmark
# auto-rebinds onto each new active market via series_refresh_seconds.

series_id = "10684"
duration = 172800                       # 48h
topologies = [1, 2, 5, 10, 15]
# rotation disabled: rotate≈warmup makes every scored sample a resubscribe-replay
# event with stale venue_timestamp, collapsing freshness P95 to ~8s and coverage
# to single digits. Use bench-sweep to study rotation effects in isolation.
connection_rotate_seconds = 0
warmup_seconds = 10.0                   # exclude per-connection backlog tail from scored metrics
warmup_compare_window_seconds = 30.0
ping_interval_seconds = 20.0
event_retention_seconds = 30.0          # 2x prior runs' max single-socket stall, defensive against backfill contamination
event_types = ["price_change"]
progress_interval_seconds = 60.0        # 5s would print 34,560 lines over 48h
series_refresh_seconds = 5.0
write_visuals = true                    # rendered once at finalization, not streamed
write_event_log = false                 # would be GBs over 48h
write_connection_log = false
include_raw_event_payload = false
verbose = false
