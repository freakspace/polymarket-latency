<svg xmlns="http://www.w3.org/2000/svg" width="920" height="360" viewBox="0 0 920 360" role="img" aria-label="Warmup Quality Check"><rect width="100%" height="100%" fill="#ffffff"/><text x="24" y="32" font-family="Inter, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#0f172a">Warmup Quality Check</text><text x="24" y="52" font-family="Inter, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b">Warmup freshness P95 (first window after connect/rebind) vs post-warmup freshness P95 (first stable window). On a healthy long run, warmup is noisier than post (subscription churn, backlog). If post is consistently worse, the run is too short, straddles a rebind, or the process is falling behind.</text><rect x="78" y="22" width="10" height="10" rx="2" fill="#dc2626"/><text x="94" y="31" font-family="Inter, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="12" fill="#475569">Warmup Freshness P95</text><rect x="218" y="22" width="10" height="10" rx="2" fill="#059669"/><text x="234" y="31" font-family="Inter, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="12" fill="#475569">Post Freshness P95</text><rect x="358" y="22" width="10" height="10" rx="2" fill="#ea580c"/><text x="374" y="31" font-family="Inter, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="12" fill="#475569">Freshness Delta</text><line x1="78" y1="288" x2="896" y2="288" stroke="#cbd5e1" stroke-width="1"/><line x1="78" y1="60" x2="78" y2="288" stroke="#cbd5e1" stroke-width="1"/><line x1="78" y1="60.00" x2="896" y2="60.00" stroke="#eef2f7" stroke-width="1"/><text x="68" y="64.00" text-anchor="end" font-family="Inter, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="11" fill="#94a3b8">4.09s</text><line x1="78" y1="105.60" x2="896" y2="105.60" stroke="#eef2f7" stroke-width="1"/><text x="68" y="109.60" text-anchor="end" font-family="Inter, system-ui, -apple-system, Segoe UI, A